name: Android CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept SDK licences and install required components
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Create empty THOTH AAR fallback
        run: |
          TARGET_DIR="$GITHUB_WORKSPACE/../THOTExpampleApp/thoth/build/outputs/aar"
          mkdir -p "$TARGET_DIR"
          python3 << 'PYEOF'
          import zipfile, os
          target = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              "../THOTExpampleApp/thoth/build/outputs/aar/thoth-debug.aar"
          )
          target = os.path.normpath(target)
          os.makedirs(os.path.dirname(target), exist_ok=True)
          if not os.path.exists(target):
              with zipfile.ZipFile(target, "w") as z:
                  pass
              print("Empty AAR created at", target)
          else:
              print("AAR already exists at", target)
          PYEOF

      - name: Gradle clean
        run: ./gradlew --no-daemon clean

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: egyptian-writer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
